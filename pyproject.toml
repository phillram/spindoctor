[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spindoctor"
version = "2.1.0"
description = "Tkinter GUI + CLI librarian for HyperSpin + RocketLauncher arcade cabinets."
readme = "README.md"
# 3.8 is the floor because that was the last Python release to officially
# support Windows 7 — the cabinet target. The frozen Windows binaries in
# GitHub Releases are built against 3.8.10 for the same reason.
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Phillip Ramirez" }]
keywords = ["hyperspin", "rocketlauncher", "arcade", "mame", "emulation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Archiving",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    # 2.32.4 is the latest patch release in the 2.32.x line that still
    # supports Python 3.8 — required for the Windows 7 SP1 binary builds.
    # 2.33.x raises the floor to Python 3.10 and so cannot be used here.
    "requests>=2.32.4",
]

[project.optional-dependencies]
# Lossless XML round-trip (preserves comments, attribute order).
# Strongly recommended when sharing a HyperSpin install with HyperHQ.
xml = ["lxml>=4.9"]
# Read inner-content hashes from non-zip archive formats during
# `verify` and `find-dupes --by-content`. .zip / .gz / .chd are
# supported out of the box (stdlib + native CHD-header parser).
archives = ["py7zr>=0.20", "rarfile>=4.0"]
# PNG contact-sheet output for `spindoctor preview --format png`.
# Without it the preview command still works, but only the HTML
# output mode is available (the PNG path falls back with a warning).
preview = ["pillow>=9.0"]
all = ["lxml>=4.9", "py7zr>=0.20", "rarfile>=4.0", "pillow>=9.0", "tkinterdnd2>=0.4"]
dev = ["pytest>=7.0", "lxml>=4.9"]
# Drag-and-drop folder support on the GUI's Setup tab. Optional —
# the GUI works without it (you just lose the drag-from-Explorer
# affordance, Browse + paste still work). Bundled into the frozen
# Windows .exe; pip users install with `pip install spindoctor[gui]`
# or `pip install spindoctor[all]`.
gui = ["tkinterdnd2>=0.4"]

[project.urls]
Homepage = "https://github.com/phillram/spindoctor"
Documentation = "https://github.com/phillram/spindoctor/tree/main/docs"
Issues = "https://github.com/phillram/spindoctor/issues"
Changelog = "https://github.com/phillram/spindoctor/blob/main/CHANGELOG.md"

[project.scripts]
spindoctor = "spindoctor.cli:cli"
# Standalone helpers — designed to run on boot or from the HyperSpin
# Tools menu without loading the full CLI.
spindoctor-fav = "spindoctor.favorites:main"
spindoctor-recent = "spindoctor.recent:main"
spindoctor-stats = "spindoctor.playtime:main"
# Tkinter GUI launcher for cabinet owners who'd rather not drop into cmd.
# Shells out to the CLI binaries above rather than re-implementing logic.
spindoctor-gui = "spindoctor.gui:main"

[tool.setuptools.packages.find]
include = ["spindoctor*"]
exclude = ["tests*", "build*", "scripts*"]

[tool.setuptools.package-data]
# Ship the window-icon assets with the wheel so iconbitmap/iconphoto
# can find them at runtime (Path(__file__).parent / "assets").
spindoctor = ["assets/*.png", "assets/*.ico"]

[tool.ruff]
# Ruff is the project's linter. Black-style formatting is deliberately
# NOT enforced (yet) — the codebase has 100+ comments aligned with
# `#` markers that an auto-formatter would mangle. A separate cleanup
# pass can enable formatting later.
#
# Line length is generous (120) so we don't have to wrap docstrings
# and comment-rich code that's already readable in a 120-col terminal.
# Tightening to 100 would force a sweeping reformat that isn't worth
# the churn for this codebase's audience (single maintainer + a
# handful of contributors).
line-length = 120
target-version = "py38"

[tool.ruff.lint]
# Start with the lowest-noise, highest-signal rules and expand later.
# F = pyflakes (real bugs: unused imports, undefined names, unused vars).
# W = pycodestyle warnings (trailing whitespace, etc.).
#
# Not selected (would trigger sweeping reformats):
#   E501 - line too long (47 violations today; would force a reformat pass)
#   E402 - module-level import not at top (1 violation; legitimate in build_windows.py)
#   E701 - multiple statements on one line (1 violation; type-stub style)
#
# Future expansion: add B (bugbear), SIM (simplification), UP (pyupgrade)
# once the baseline is clean.
select = ["F", "W"]

[tool.pytest.ini_options]
# Suppress the Python 3.12 + Tkinter + pytest tracemalloc flake.
#
# Tkinter's `Variable.__del__` raises `RuntimeError: main thread is
# not in main loop` when GC fires after Tk's main loop has exited.
# The exception goes to `sys.unraisablehook`; pytest's hook then
# tries `tracemalloc.get_object_traceback`, which on Py 3.12 trips
# a "partially initialized module 'tracemalloc' has no attribute
# 'get_object_traceback'" circular-import quirk. That second crash
# gets re-raised as a test failure even though the test itself
# passed — and lands non-deterministically on whichever GUI-touching
# test pytest happened to be running when GC ran.
#
# Demoting the warning to `default` (instead of pytest's implicit
# `error`) means the unraisable is reported as a warning but does
# not fail the run. Production code is unaffected — this is a
# test-runner-only knob.
filterwarnings = [
    "default::pytest.PytestUnraisableExceptionWarning",
]

[tool.bandit]
# B324 (weak hash): SHA-1 / MD5 are used for *non-cryptographic* integrity
#   checks — ROM verification against No-Intro DAT (the DATs themselves
#   ship SHA-1), file dedupe, and lint duplicate-body detection. Switching
#   to SHA-256 would break compatibility with ecosystem DATs.
# B314 (XML without defusedxml): all XML inputs are local files the
#   user controls (HyperSpin databases, RocketLauncher INIs, MAME
#   -listxml output). Adopting `defusedxml` is tracked as a follow-up
#   but not load-bearing under the current threat model.
skips = ["B324", "B314"]
