version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # PyInstaller 6.x raised its minimum Windows target to 8.1;
      # the 6.x bootloader fails on Windows 7 SP1 which is a supported
      # cabinet target. Pin to 5.x until Win 7 support is formally dropped.
      - dependency-name: pyinstaller
        versions: [">=6"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
