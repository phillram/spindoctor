name: Release Windows binaries

# Triggers on any tag matching v*  (e.g. v1.0.0, v1.0.1, v1.1.0-rc1).
# Manual dispatch is also supported for dry-runs that don't publish a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (no release published)'
        required: false

permissions:
  contents: write       # create the GitHub Release and upload assets
  id-token: write       # required by attest-build-provenance for OIDC
  attestations: write   # required by attest-build-provenance to record SLSA

jobs:
  build:
    name: Build Windows executables
    # windows-2022 is the oldest Windows runner GitHub still offers
    # (windows-2019 was retired). The Win 7 SP1 compatibility of the
    # produced exe comes from CPython 3.8.10 itself — pinned below —
    # not from the build host's SDK version, so a newer runner is fine.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python 3.8
        # Python 3.8 was the last release to officially support Windows 7.
        # Building with 3.8 keeps the bundled CPython runtime compatible.
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.8.10'

      - name: Install runtime + build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[all]
          pip install -r build/requirements-build.txt

      # Unit tests are intentionally NOT re-run here. The CI workflow
      # (.github/workflows/ci.yml) already runs `pytest -q` on the same
      # windows-2022 + Python 3.8 matrix on every push to main, so by
      # the time a `v*` tag exists those tests are known-green. Running
      # them again in the release pipeline doubled wall-clock time
      # (~5+ min) and added a flaky failure path for shipping a release.
      # The PyInstaller smoke step below is the release-specific guard.

      - name: Build Windows executables
        shell: bash
        run: python build/build_windows.py

      - name: Smoke-test every binary
        # --onefile build: each binary is a self-contained exe in dist\.
        shell: cmd
        run: |
          dist\spindoctor.exe --version
          dist\spindoctor-fav.exe --help
          dist\spindoctor-recent.exe --help
          dist\spindoctor-stats.exe --help

      # spindoctor-gui.exe is a `--windowed` build (Win32 GUI subsystem),
      # so cmd doesn't wait for it and stdout is detached — `--version`
      # works in code but the shell can't observe its exit. The check
      # below confirms PyInstaller produced the file; importing the
      # module here exercises its argument-handling path the same way
      # the frozen binary does at startup.
      - name: Smoke-test GUI module
        shell: bash
        run: |
          test -f dist/spindoctor-gui.exe
          python -c "import sys; from spindoctor.gui import main; sys.exit(main(['--version']))"

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag || 'manual' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package as zip
        # Zip just the five flat EXEs from dist/ — each is self-contained.
        shell: bash
        run: |
          mkdir -p artifacts
          cd dist && 7z a "../artifacts/spindoctor-windows-${{ steps.tag.outputs.tag }}.zip" *.exe

      # Lets users verify their download with `sha256sum -c SHA256SUMS.txt`.
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd artifacts && sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Records a signed SLSA provenance statement so users can run
      # `gh attestation verify <zip> --repo ${{ github.repository }}`
      # to prove the artifact came from this workflow on this repo.
      - name: Attest build provenance
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        # continue-on-error: attestation uses GitHub's OIDC / Sigstore API
        # which has occasional transient failures. A failed attestation is not
        # a reason to skip Upload or Publish — the zip is already built and
        # the SHA256 checksum is already generated. Users can still verify the
        # download; they just won't get the `gh attestation verify` path.
        continue-on-error: true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: 'artifacts/*.zip'

      - name: Upload build artifacts
        # Always uploaded, even on workflow_dispatch — useful for testing the
        # build pipeline without publishing a release.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: spindoctor-windows-${{ steps.tag.outputs.tag }}
          path: artifacts/*.zip
          retention-days: 30

      - name: Build release notes
        # Pulls the curated section from CHANGELOG.md and prepends a short
        # header about the binaries. The auto-generated PR / commit list
        # appended by `generate_release_notes: true` lands underneath.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          {
            echo "## Windows binaries"
            echo
            echo "Built with Python 3.8.10 + PyInstaller 5.13.2 on \`windows-2022\`. Runs on Windows 7 SP1 and newer."
            echo
            echo "Extract the zip — you get five self-contained \`.exe\` files. Move them to a folder of your choice (e.g. \`C:\spindoctor\\\`), then double-click \`spindoctor-gui.exe\` to launch. No Python install required. See [docs/installation.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/installation.md#windows-binaries-no-python-required) for the full walkthrough."
            echo
            echo "**What's in \`spindoctor-windows-${{ github.ref_name }}.zip\`:**"
            echo
            echo "\`\`\`"
            echo "spindoctor-windows-${{ github.ref_name }}.zip"
            echo "├── spindoctor.exe          ← full CLI"
            echo "├── spindoctor-gui.exe      ← double-clickable GUI launcher"
            echo "├── spindoctor-fav.exe      ← Favorites wheel manager"
            echo "├── spindoctor-recent.exe   ← Recently Played rebuild"
            echo "└── spindoctor-stats.exe    ← playtime reports + Most Played wheel"
            echo "\`\`\`"
            echo
            echo "**Verify your download:**"
            echo
            echo "- \`SHA256SUMS.txt\` — verify with \`sha256sum -c SHA256SUMS.txt\`."
            echo "- Build provenance: \`gh attestation verify spindoctor-windows-${{ github.ref_name }}.zip --repo ${{ github.repository }}\` proves the zip came from this workflow."
            echo
            echo "---"
            echo
            python build/extract_changelog.py "${{ github.ref_name }}"
          } > release-notes.md
          echo "::group::Release notes"
          cat release-notes.md
          echo "::endgroup::"

      - name: Publish GitHub Release
        # ── DO NOT CREATE OR EDIT THIS RELEASE MANUALLY ──────────────────────
        # This step is the canonical source of the release title and body.
        # Running `gh release create` or editing the release in the GitHub UI
        # before this step completes will produce an incorrectly formatted
        # release. Wait ~4 minutes after pushing the tag for this step to run.
        #
        # Release format enforced here:
        #   Title : SpinDoctor vX.Y.Z
        #   Body  : Windows binaries header
        #           + CHANGELOG section (build/extract_changelog.py)
        #           + auto-generated "What's Changed" PR list
        #   Assets: spindoctor-windows-vX.Y.Z.zip + SHA256SUMS.txt
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          name: SpinDoctor ${{ github.ref_name }}
          # generate_release_notes still appends "What's Changed" PR list
          # below the curated body — best of both worlds.
          generate_release_notes: true
          body_path: release-notes.md
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
