name: Release Windows binaries

# Triggers on any tag matching v*  (e.g. v1.0.0, v1.0.1, v1.1.0-rc1).
# Manual dispatch is also supported for dry-runs that don't publish a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (no release published)'
        required: false

permissions:
  contents: write       # create the GitHub Release and upload assets
  id-token: write       # required by attest-build-provenance for OIDC
  attestations: write   # required by attest-build-provenance to record SLSA

jobs:
  # ── Win7 build ──────────────────────────────────────────────────────────────
  # Python 3.8 + PyInstaller 5.x — the only pairing whose bootloader loads on
  # Windows 7 SP1.  Produces five self-contained --onefile EXEs.
  build-win7:
    name: Build (Windows 7 SP1+)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.8
        # Python 3.8 was the last release to officially support Windows 7 SP1.
        # Building with 3.8 keeps the bundled CPython runtime compatible.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.8.10'

      - name: Install runtime + build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[all]
          pip install -r build/requirements-build.txt

      - name: Build Windows executables (Win7)
        shell: bash
        run: python build/build_windows.py

      - name: Smoke-test every binary
        # --onefile build: each binary is a self-contained exe in dist\.
        shell: cmd
        run: |
          dist\spindoctor.exe --version
          dist\spindoctor-fav.exe --help
          dist\spindoctor-recent.exe --help
          dist\spindoctor-stats.exe --help

      # spindoctor-gui.exe is a `--windowed` build (Win32 GUI subsystem),
      # so cmd doesn't wait for it and stdout is detached — `--version`
      # works in code but the shell can't observe its exit. The check
      # below confirms PyInstaller produced the file; importing the
      # module here exercises its argument-handling path the same way
      # the frozen binary does at startup.
      - name: Smoke-test GUI module
        shell: bash
        run: |
          test -f dist/spindoctor-gui.exe
          python -c "import sys; from spindoctor.gui import main; sys.exit(main(['--version']))"

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag || 'manual' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Win7 zip
        # Zip just the five flat EXEs from dist/ — each is self-contained.
        shell: bash
        run: |
          mkdir -p artifacts
          cd dist && 7z a "../artifacts/spindoctor-win7-${{ steps.tag.outputs.tag }}.zip" *.exe

      - name: Generate SHA256 checksums (Win7)
        shell: bash
        run: |
          cd artifacts && sha256sum *.zip > SHA256SUMS-win7.txt
          cat SHA256SUMS-win7.txt

      - name: Attest build provenance (Win7)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: 'artifacts/spindoctor-win7-${{ steps.tag.outputs.tag }}.zip'

      - name: Upload Win7 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: win7-bundle
          path: |
            artifacts/spindoctor-win7-${{ steps.tag.outputs.tag }}.zip
            artifacts/SHA256SUMS-win7.txt
          retention-days: 30

  # ── Modern build ─────────────────────────────────────────────────────────────
  # Python 3.12 + PyInstaller 6.x — Windows 10/11 only.
  # PyInstaller 6.x produces a clean _internal/ shared-runtime layout so COLLECT
  # can deduplicate the Python runtime across all five EXEs (the PR #273 goal that
  # was reverted in PR #275 because PyInstaller 5.x couldn't produce _internal/).
  build-modern:
    name: Build (Windows 10/11+)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install runtime + build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[all]
          pip install -r build/requirements-build-modern.txt

      - name: Build Windows executables (modern)
        shell: bash
        run: python build/build_windows.py --modern

      - name: Smoke-test every binary
        shell: cmd
        run: |
          dist\spindoctor-win10\spindoctor.exe --version
          dist\spindoctor-win10\spindoctor-fav.exe --help
          dist\spindoctor-win10\spindoctor-recent.exe --help
          dist\spindoctor-win10\spindoctor-stats.exe --help

      # GUI in --onedir mode: the EXE sits in spindoctor-win10/ alongside its
      # siblings, so Path(sys.executable).parent finds them correctly.
      - name: Smoke-test GUI module
        shell: bash
        run: |
          test -f dist/spindoctor-win10/spindoctor-gui.exe
          python -c "import sys; from spindoctor.gui import main; sys.exit(main(['--version']))"

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag || 'manual' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package modern zip
        # Rename the output folder to include the version tag before zipping so
        # extracting the zip produces spindoctor-win10-vX.Y.Z/ (not the bare
        # spindoctor-win10/ name that PyInstaller writes).
        shell: bash
        run: |
          mkdir -p artifacts
          cd dist
          mv spindoctor-win10 "spindoctor-win10-${{ steps.tag.outputs.tag }}"
          7z a "../artifacts/spindoctor-win10-${{ steps.tag.outputs.tag }}.zip" "spindoctor-win10-${{ steps.tag.outputs.tag }}"

      - name: Generate SHA256 checksums (modern)
        shell: bash
        run: |
          cd artifacts && sha256sum *.zip > SHA256SUMS-modern.txt
          cat SHA256SUMS-modern.txt

      - name: Attest build provenance (modern)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: 'artifacts/spindoctor-win10-${{ steps.tag.outputs.tag }}.zip'

      - name: Upload modern artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: modern-bundle
          path: |
            artifacts/spindoctor-win10-${{ steps.tag.outputs.tag }}.zip
            artifacts/SHA256SUMS-modern.txt
          retention-days: 30

  # ── Publish ──────────────────────────────────────────────────────────────────
  # Waits for both builds, merges checksums, and creates the GitHub Release.
  # Only runs on tag pushes — workflow_dispatch builds upload artifacts but
  # don't publish.
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-win7, build-modern]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download Win7 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: win7-bundle
          path: artifacts

      - name: Download modern artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: modern-bundle
          path: artifacts

      - name: Merge SHA256 checksums
        run: |
          cat artifacts/SHA256SUMS-win7.txt artifacts/SHA256SUMS-modern.txt > artifacts/SHA256SUMS.txt
          echo "=== Combined SHA256SUMS.txt ==="
          cat artifacts/SHA256SUMS.txt

      - name: Build release notes
        # Pulls the curated section from CHANGELOG.md and prepends a short
        # header about the binaries. The auto-generated PR / commit list
        # appended by `generate_release_notes: true` lands underneath.
        shell: bash
        run: |
          {
            echo "## Windows binaries"
            echo
            echo "Two bundles are available — pick whichever matches your Windows version:"
            echo
            echo "| Bundle | File | Requires | Python | PyInstaller |"
            echo "|---|---|---|---|---|"
            echo "| **Modern** *(recommended)* | \`spindoctor-win10-${{ github.ref_name }}.zip\` | Windows 10/11 | 3.12 | 6.x |"
            echo "| **Win7** | \`spindoctor-win7-${{ github.ref_name }}.zip\` | Windows 7 SP1+ | 3.8 | 5.x |"
            echo
            echo "**Not sure which to pick?** Windows 10 or 11 → grab the Modern bundle. Windows 7 SP1, 8, or 8.1 → grab the Win7 bundle. The Win7 bundle also works on Windows 10/11 if you prefer the simpler five-EXE layout."
            echo
            echo "### Modern bundle (Windows 10/11)"
            echo
            echo "Shared-runtime \`--onedir\` build — the Python runtime lives once in \`_internal/\` instead of being embedded in each EXE."
            echo
            echo "\`\`\`"
            echo "spindoctor-win10-${{ github.ref_name }}.zip"
            echo "└── spindoctor-win10-${{ github.ref_name }}/"
            echo "    ├── spindoctor.exe          ← full CLI"
            echo "    ├── spindoctor-gui.exe      ← double-clickable GUI launcher"
            echo "    ├── spindoctor-fav.exe      ← Favorites wheel manager"
            echo "    ├── spindoctor-recent.exe   ← Recently Played rebuild"
            echo "    ├── spindoctor-stats.exe    ← playtime reports + Most Played wheel"
            echo "    └── _internal/              ← shared Python 3.12 runtime"
            echo "\`\`\`"
            echo
            echo "Extract the zip, then double-click \`spindoctor-win10-${{ github.ref_name }}\\spindoctor-gui.exe\`. Keep all files in the same folder."
            echo
            echo "### Win7 bundle (Windows 7 SP1 and newer)"
            echo
            echo "Five self-contained \`--onefile\` EXEs — each is a standalone self-extracting archive. Drop them in a folder of your choice."
            echo
            echo "\`\`\`"
            echo "spindoctor-win7-${{ github.ref_name }}.zip"
            echo "├── spindoctor.exe          ← full CLI"
            echo "├── spindoctor-gui.exe      ← double-clickable GUI launcher"
            echo "├── spindoctor-fav.exe      ← Favorites wheel manager"
            echo "├── spindoctor-recent.exe   ← Recently Played rebuild"
            echo "└── spindoctor-stats.exe    ← playtime reports + Most Played wheel"
            echo "\`\`\`"
            echo
            echo "**Verify your download:**"
            echo
            echo "- \`SHA256SUMS.txt\` — verify with \`sha256sum -c SHA256SUMS.txt\`."
            echo "- Build provenance: \`gh attestation verify <zip> --repo ${{ github.repository }}\` proves the zip came from this workflow."
            echo
            echo "---"
            echo
            python build/extract_changelog.py "${{ github.ref_name }}"
          } > release-notes.md
          echo "::group::Release notes"
          cat release-notes.md
          echo "::endgroup::"

      - name: Publish GitHub Release
        # ── DO NOT CREATE OR EDIT THIS RELEASE MANUALLY ──────────────────────
        # This step is the canonical source of the release title and body.
        # Running `gh release create` or editing the release in the GitHub UI
        # before this step completes will produce an incorrectly formatted
        # release. Wait ~8 minutes after pushing the tag for both builds to
        # complete and this step to run.
        #
        # Release format enforced here:
        #   Title : SpinDoctor vX.Y.Z
        #   Body  : Two-bundle download table
        #           + CHANGELOG section (build/extract_changelog.py)
        #           + auto-generated "What's Changed" PR list
        #   Assets: both zips + SHA256SUMS.txt
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: SpinDoctor ${{ github.ref_name }}
          generate_release_notes: true
          body_path: release-notes.md
          files: |
            artifacts/spindoctor-win7-${{ github.ref_name }}.zip
            artifacts/spindoctor-win10-${{ github.ref_name }}.zip
            artifacts/SHA256SUMS.txt
