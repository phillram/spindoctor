name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter here — PRs are sometimes stacked on top of
  # another open PR's branch (base != main) rather than merging through
  # main one at a time, and a `branches: [main]` filter here means CI
  # silently never runs for those (confirmed: PRs #310/#311, based on
  # feature branches, reported zero checks while #309, based on main,
  # ran fine). Every PR's tests must run regardless of its base branch.
  pull_request: {}

jobs:
  lint:
    # Ruff is the project's configured linter (see [tool.ruff] in
    # pyproject.toml) but was never wired into CI — two F821 NameErrors
    # (generate-config dry-run, GUI _load_games_for_system) shipped to
    # main because nothing ran it. Tests alone can't catch an undefined
    # name on a path no test executes; this job pins the whole repo.
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  test:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Coverage rationale:
      # * ubuntu-latest × {3.8, 3.12} — catches Python 3.8 stdlib/syntax
      #   regressions (the Win 7 cabinet floor) and the modern interpreter.
      # * windows-2022 × 3.12 — catches Windows-specific path / encoding /
      #   filesystem behaviour. We don't run windows-2022 × 3.8 here because
      #   Defender + NTFS make it 4× slower than 3.12 (≈21min vs ≈5min)
      #   without finding bugs the 3.8.10-frozen build-smoke job below
      #   wouldn't already catch.
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.8'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-2022
            python-version: '3.12'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          # Cache the pip download wheelhouse keyed on pyproject.toml so
          # subsequent runs skip re-downloading lxml/Pillow/py7zr.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all]
          pip install pytest pytest-xdist

      # The Tk-construction smoke test (test_gui_constructs_against_real_tk)
      # needs a display server. Linux runners are headless by default, so
      # install xvfb here and run pytest through xvfb-run. Without this
      # the smoke test self-skips and the whole point of having it — to
      # catch widget-construction regressions at PR time — is lost.
      # python3-tk gives Tk itself (tkinter is stdlib but the underlying
      # Tcl/Tk libraries are not bundled with the actions/setup-python build).
      - name: Install Tk + xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb python3-tk tk

      # -n auto fans tests across the runner's CPUs. On the Windows runner
      # this roughly halves wall time; on Linux it's a smaller win but
      # still positive. xvfb-run wraps the whole pytest invocation so the
      # GUI smoke gets a virtual display while every other test sees a
      # normal env. Windows has a real windowstation, so no wrapper there.
      - name: Run tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -q -n auto

      # actions/setup-python on Windows does not set TCL_LIBRARY, so Tcl
      # cannot locate init.tcl and tk.Tk() raises TclError at test time.
      # Two layout variations exist across Python patch releases:
      #   prefix/tcl/tcl8.6.15/   (standard Windows installer)
      #   prefix/tcl8.6.15/library/ (actions/setup-python toolcache, 3.12+)
      # The original glob "tcl/tcl8*" misses the second layout entirely.
      # Within each candidate, init.tcl may be at the root OR in library/.
      # Zero-byte stub files (e.g. tcl/tcl8.6/init.tcl in 3.12.10) pass
      # exists() but Tcl cannot source them; st_size > 0 filters them out.
      # as_posix() produces forward slashes; mixed paths trip Tcl.
      - name: Set TCL_LIBRARY (Windows)
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os, pathlib
          prefix = pathlib.Path(__import__('sys').prefix)
          candidates = sorted(
              list(dict.fromkeys([*prefix.glob("tcl/tcl8*"), *prefix.glob("tcl8*")])),
              key=lambda p: p.name, reverse=True,
          )
          found = None
          for candidate in candidates:
              for sub in (candidate, candidate / "library"):
                  init = sub / "init.tcl"
                  try:
                      if init.exists() and init.stat().st_size > 0:
                          found = sub
                          break
                  except OSError:
                      pass
              if found:
                  break
          if found:
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write(f"TCL_LIBRARY={found.as_posix()}\n")
              print(f"TCL_LIBRARY={found.as_posix()}")
          else:
              print("WARNING: init.tcl not found — Tk tests may fail")

      # pytest-xdist worker processes on Windows are spawned without a
      # desktop handle, so tk.Tk() raises "no windowstation" inside workers.
      # Run GUI tests in the main process (no -n) and everything else in
      # parallel so the windowstation is always available for Tk.
      - name: Run non-GUI tests (Windows, parallel)
        if: runner.os == 'Windows'
        run: pytest -q -n auto --ignore=tests/test_gui.py

      - name: Run GUI tests (Windows, serial)
        if: runner.os == 'Windows'
        run: pytest -q tests/test_gui.py

  build-smoke:
    name: PyInstaller build smoke test
    # On every PR, verify the Windows build still produces working binaries.
    # Catches regressions in PyInstaller hidden imports before a release tag.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.8.10'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            build/requirements-build.txt

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[all]
          pip install -r build/requirements-build.txt
          pip install pytest pytest-xdist

      # Run the Tk-construction smoke against Python 3.8.10's bundled
      # Tcl/Tk — the *exact* Tk the frozen exe ships with. The main test
      # matrix above uses Python 3.12, whose Tk keysym/option tables are
      # wider; bugs that depend on the older surface (e.g. v1.9.0's
      # `bad event type or keysym "grave"` on Ctrl+`) only fire here.
      # Without this step the bug only shows up to end users running the
      # frozen installer. We run only the GUI tests to keep this job
      # focused — the broader suite already runs on 3.8/Linux.
      - name: GUI smoke (Python 3.8 Tk surface)
        shell: cmd
        run: pytest -q tests/test_gui.py

      - name: Build
        shell: bash
        run: python build/build_windows.py

      - name: Smoke-test binaries
        # --onefile build: each binary is a self-contained exe in dist\.
        # spindoctor-gui.exe is --windowed so cmd can't observe its exit —
        # verify the file exists via bash instead.
        shell: cmd
        run: |
          dist\spindoctor.exe --version
          dist\spindoctor-fav.exe --help
          dist\spindoctor-recent.exe --help
          dist\spindoctor-stats.exe --help

      - name: Smoke-test GUI binary exists
        shell: bash
        run: test -f dist/spindoctor-gui.exe

  build-smoke-modern:
    name: PyInstaller build smoke test (modern, Win10/11)
    # Verifies the --modern COLLECT build (Python 3.12 + PyInstaller 6.x)
    # produces working binaries from the shared-runtime --onedir layout.
    # The main test matrix (windows-2022 × 3.12) already covers Python 3.12
    # Tk/library behaviour; this job focuses on the build path itself.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            build/requirements-build-modern.txt

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[all]
          pip install -r build/requirements-build-modern.txt

      - name: Build (modern --onedir)
        shell: bash
        run: python build/build_windows.py --modern

      - name: Smoke-test binaries (from shared-runtime folder)
        # --onedir build: EXEs live in dist\spindoctor-win10\ alongside _internal\.
        # spindoctor-gui.exe is --windowed; verify the file exists via bash.
        shell: cmd
        run: |
          dist\spindoctor-win10\spindoctor.exe --version
          dist\spindoctor-win10\spindoctor-fav.exe --help
          dist\spindoctor-win10\spindoctor-recent.exe --help
          dist\spindoctor-win10\spindoctor-stats.exe --help

      - name: Smoke-test GUI binary exists
        shell: bash
        run: test -f dist/spindoctor-win10/spindoctor-gui.exe

      - name: Verify _internal shared runtime present
        shell: bash
        run: test -d dist/spindoctor-win10/_internal
