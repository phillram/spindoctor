name: Security

on:
  push:
    branches: [main]
  # No `branches:` filter — see ci.yml for why: a base-branch filter here
  # means CI silently never runs for PRs stacked on another open PR
  # (base != main).
  pull_request: {}
  schedule:
    # Weekly Monday 06:00 UTC — catches new CVEs against pinned deps even
    # when no PR is open.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install 'bandit[toml]'

      # -ll = report medium severity and above; tests/ excluded because
      # asserts there are deliberate, not security-relevant. Skip rules
      # are documented in [tool.bandit] in pyproject.toml.
      - name: Run Bandit
        run: bandit -r spindoctor -ll -c pyproject.toml

  pip-audit:
    name: pip-audit (CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install project + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all]
          pip install pip-audit

      # --skip-editable skips spindoctor itself (editable installs aren't
      # on PyPI to look up). We deliberately omit --strict because that
      # promotes the editable-skip *warning* to a fatal error; pip-audit
      # already exits non-zero on real CVE findings without it.
      - name: Run pip-audit
        run: pip-audit --skip-editable
