name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC — catches new CVEs against pinned deps even
    # when no PR is open.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install 'bandit[toml]'

      # -ll = report medium severity and above; tests/ excluded because
      # asserts there are deliberate, not security-relevant. Skip rules
      # are documented in [tool.bandit] in pyproject.toml.
      - name: Run Bandit
        run: bandit -r spindoctor -ll -c pyproject.toml

  pip-audit:
    name: pip-audit (CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install project + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all]
          pip install pip-audit

      # --strict makes warnings fatal. --skip-editable skips spindoctor
      # itself (editable installs aren't on PyPI to look up).
      # CVE-2026-3219 is in pip itself with no fix yet — pip is a build
      # tool here, not a runtime dep, so we ignore until a fix lands.
      - name: Run pip-audit
        run: pip-audit --strict --skip-editable --ignore-vuln CVE-2026-3219
